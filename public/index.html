<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>기리고</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400&family=Space+Mono:wght@400&display=swap');

:root {
  --w: 100dvw;
  --h: 100dvh;
  --pad: clamp(16px, 5vw, 32px);
  --logo: clamp(170px, 48vmin, 280px);
  --cd-ring: min(92vw, 78dvh, 640px);
  --accent: rgb(255, 40, 40);
  --red-dim: rgba(180, 0, 0, .13);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Noto Serif KR', serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

/* ─── PAGES ─── */
.page {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .65s ease;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.page.active { opacity: 1; pointer-events: all; }

/* ─── FLASH ─── */
#flash {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease;
}
#flash.in { opacity: 0.09; }

/* ─── RED VEIL — shown ONLY after wish is granted ─── */
#red-veil {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(160,0,0,.22) 0%, rgba(80,0,0,.55) 100%);
  opacity: 0;
  transition: opacity 2.4s ease;
}
#red-veil.on { opacity: 1; }

@keyframes veil-breathe {
  0%,100% { opacity: .82; }
  50%      { opacity: 1;   }
}
#red-veil.on { animation: veil-breathe 4s ease-in-out infinite; }

/* ─── NOISE ─── */
#noise {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  opacity: .045;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.sound-embed {
  position: fixed; left: -120px; top: 0;
  width: 110px; height: 200px;
  border: 0; opacity: 0; pointer-events: none;
}

/* ══════════════════════════════
   SPLASH
══════════════════════════════ */
#p-splash { gap: 0; justify-content: center; align-items: center; }

.sp-title-top {
  font-size: clamp(80px, 24vw, 140px);
  letter-spacing: .28em;
  color: rgba(255,255,255,.95);
  font-weight: 300;
  text-align: center;
  margin-bottom: clamp(20px, 5vmin, 36px);
  animation: title-breathe 6s ease-in-out infinite;
  text-shadow: 0 0 60px rgba(255,40,40,.18);
  cursor: pointer;
}
@keyframes title-breathe {
  0%,100% { opacity: .92; text-shadow: 0 0 60px rgba(255,40,40,.12); }
  50%      { opacity: 1;   text-shadow: 0 0 80px rgba(255,40,40,.30); }
}

.logo-wrap {
  position: relative;
  width: var(--logo); height: var(--logo);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  perspective: 600px;
}

#logo-canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  width: var(--logo); height: var(--logo);
  will-change: transform;
  transform-style: preserve-3d;
}

.sp-tap {
  margin-top: clamp(24px, 6vmin, 40px);
  font-size: clamp(16px, 4.5vw, 26px);
  letter-spacing: .42em;
  color: rgba(255,255,255,.7);
  animation: pulse-txt 2.8s ease-in-out infinite;
  cursor: pointer;
  text-align: center;
}
@keyframes pulse-txt {
  0%,100% { opacity: 0;   }
  40%,60%  { opacity: 1;   }
}

/* ══════════════════════════════
   CAMERA
══════════════════════════════ */
#p-cam { padding: 0; }
#vid {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  filter: grayscale(65%) contrast(1.1) brightness(.72);
}
.cam-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(0,0,0,.75) 0%,
    transparent 28%,
    transparent 50%,
    rgba(0,0,0,.98) 100%);
  pointer-events: none;
}
.cam-scanline {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg,
    transparent, transparent 2px,
    rgba(0,0,0,.04) 2px, rgba(0,0,0,.04) 4px);
  pointer-events: none; opacity: .3;
}
.cam-top {
  position: absolute; top: 0; left: 0; right: 0;
  height: clamp(52px,13vmin,68px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--pad); z-index: 10;
  padding-top: env(safe-area-inset-top);
}
.cam-back {
  background: transparent; border: none;
  color: rgba(255,255,255,.65);
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(13px, 3.2vw, 16px); letter-spacing: .22em;
  cursor: pointer; transition: color .3s;
  -webkit-tap-highlight-color: transparent;
}
.cam-back:hover, .cam-back:active { color: rgba(255,255,255,.95); }
.cam-label {
  font-size: clamp(14px, 3.5vw, 18px);
  letter-spacing: .5em;
  color: rgba(255,255,255,.6);
}
.cam-rec {
  font-size: clamp(12px, 2.8vw, 15px); letter-spacing: .2em;
  color: transparent; transition: color .3s;
  display: flex; align-items: center; gap: 6px;
}
.cam-rec.on { color: rgba(255,80,80,.95); }
.cam-rec-dot { width: 7px; height: 7px; border-radius: 50%; background: rgb(255,60,60); animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.cam-bot {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 0 var(--pad) calc(env(safe-area-inset-bottom) + clamp(32px,10vmin,56px));
  display: flex; flex-direction: column; align-items: center; gap: clamp(12px,3vmin,20px);
  z-index: 10;
}
.cam-hint {
  font-size: clamp(14px, 3.5vw, 18px);
  letter-spacing: .32em;
  color: rgba(255,255,255,.75);
  text-align: center; min-height: 22px;
}
.cam-timer {
  font-family: 'Space Mono', monospace;
  font-size: clamp(28px, 8vmin, 42px);
  color: rgba(255,80,80,1); letter-spacing: .06em;
  opacity: 0; transition: opacity .3s;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 24px rgba(255,40,40,.5);
}
.cam-timer.show { opacity: 1; }

.rec-btn {
  width: clamp(84px,20vmin,110px); height: clamp(84px,20vmin,110px);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.28);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .3s;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
.rec-btn:active { border-color: rgba(255,255,255,.65); }
.rec-btn.recording { border-color: rgba(255,60,60,.8); }
.rec-btn.recording #rec-logo { opacity: 1; }
#rec-logo {
  width: 78%; height: 78%; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
  opacity: .92;
}

.cam-err {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  z-index: 20; background: #000;
  opacity: 0; pointer-events: none; transition: opacity .5s;
}
.cam-err.show { opacity: 1; pointer-events: all; }
.cam-err p {
  font-size: clamp(14px, 3.4vw, 18px); letter-spacing: .18em;
  color: rgba(255,255,255,.72); text-align: center; line-height: 2.2;
  max-width: min(280px, 80vw);
}

/* ══════════════════════════════
   REVIEW — maximized video
══════════════════════════════ */
#p-review { padding: 0; background: #000; }

/* Full-bleed video preview */
#prev-vid {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain; /* contain = show full frame no crop */
  background: #000;
  transform: scaleX(-1); /* mirror like camera */
  filter: grayscale(55%);
}

/* dark vignette so UI is readable */
.rev-overlay {
  position: absolute; inset: 0;
  background:
    linear-gradient(to bottom,
      rgba(0,0,0,.82) 0%,
      transparent 20%,
      transparent 72%,
      rgba(0,0,0,.95) 100%);
  pointer-events: none;
  z-index: 2;
}

.rev-top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: calc(env(safe-area-inset-top) + clamp(14px,4vmin,22px)) var(--pad) 0;
  z-index: 3;
  display: flex; align-items: center; justify-content: center;
}
.rev-label {
  font-size: clamp(14px, 3.8vw, 20px);
  letter-spacing: .48em;
  color: rgba(255,255,255,.82);
  text-align: center;
  text-shadow: 0 1px 8px rgba(0,0,0,.8);
}

.rev-bot {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 0 var(--pad) calc(env(safe-area-inset-bottom) + clamp(28px,8vmin,48px));
  display: flex; flex-direction: column; align-items: center; gap: clamp(10px,2.5vmin,16px);
  z-index: 3;
}
.rev-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.rev-btn {
  background: transparent; border: 1px solid rgba(255,255,255,.22);
  color: rgba(255,255,255,.62);
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(14px, 3.4vw, 17px); letter-spacing: .28em;
  padding: clamp(10px,2.8vmin,14px) clamp(18px,4.5vw,26px);
  cursor: pointer; transition: all .3s;
  -webkit-tap-highlight-color: transparent;
}
.rev-btn:hover, .rev-btn:active { color: rgba(255,255,255,.92); border-color: rgba(255,255,255,.5); }
.rev-btn.primary { border-color: rgba(255,60,60,.55); color: rgba(255,160,160,.9); }
.rev-btn.primary:hover, .rev-btn.primary:active { border-color: rgba(255,60,60,.85); color: #fff; }

/* uploading state on review page */
.rev-uploading {
  display: none;
  font-size: clamp(12px, 2.8vw, 15px);
  letter-spacing: .3em; color: rgba(255,200,200,.7);
  text-align: center;
}
.rev-uploading.show { display: block; }

/* ══════════════════════════════
   TRANSMIT
══════════════════════════════ */
#p-transmit { gap: clamp(20px,5vmin,32px); }
.tx-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
.tx-ring {
  position: absolute;
  width: clamp(110px,32vmin,160px); height: clamp(110px,32vmin,160px);
  border-radius: 50%; border: 1px solid rgba(255,60,60,.25);
  animation: tx-expand 2.4s ease-out infinite;
}
.tx-ring:nth-child(2) { animation-delay: .8s; }
.tx-ring:nth-child(3) { animation-delay: 1.6s; }
@keyframes tx-expand {
  0%   { transform: scale(.6); opacity: .6; }
  100% { transform: scale(2.2); opacity: 0; }
}
#tx-canvas {
  image-rendering: pixelated; image-rendering: crisp-edges;
  width: clamp(90px,26vmin,130px); height: clamp(90px,26vmin,130px);
  display: block; will-change: transform; transform-style: preserve-3d;
}
.tx-label {
  font-size: clamp(15px, 3.8vw, 20px);
  letter-spacing: .42em;
  color: rgba(255,255,255,.72);
}
.tx-dots { display: flex; gap: 8px; }
.tx-dots span {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,80,80,.8);
  animation: td 1.6s ease-in-out infinite;
}
.tx-dots span:nth-child(2) { animation-delay: .22s; }
.tx-dots span:nth-child(3) { animation-delay: .44s; }
@keyframes td { 0%,80%,100%{opacity:.1} 40%{opacity:1} }

/* ══════════════════════════════
   RESULT
══════════════════════════════ */
#p-result {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: clamp(40px,12vmin,64px) var(--pad) clamp(40px,12vmin,64px);
  justify-content: center; align-items: center; gap: clamp(14px,3.5vmin,22px);
}
.res-top { display: flex; flex-direction: column; align-items: center; gap: clamp(12px,3vmin,18px); }
.res-status {
  font-size: clamp(17px, 4.5vw, 24px);
  letter-spacing: .42em;
  color: rgba(255,255,255,.88);
  text-align: center;
}
#res-canvas {
  image-rendering: pixelated; image-rendering: crisp-edges;
  width: clamp(80px,22vmin,110px); height: clamp(80px,22vmin,110px);
  display: block;
}

/* oracle badge — shown on result page */
.oracle-badge {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 24px;
  border: 1px solid rgba(255,80,80,.25);
  text-align: center;
}
.oracle-badge .ob-symbol {
  font-size: clamp(20px,5vw,28px); color: rgba(255,100,100,.9);
  text-shadow: 0 0 20px rgba(255,40,40,.5);
  letter-spacing: .1em;
}
.oracle-badge .ob-phase {
  font-size: clamp(11px,2.6vw,14px); letter-spacing: .42em;
  color: rgba(255,180,180,.65);
}
.oracle-badge .ob-text {
  font-size: clamp(12px,2.8vw,15px); letter-spacing: .18em;
  color: rgba(255,220,220,.75); line-height: 2; max-width: min(280px,80vw);
}

.res-actions { width: min(300px,88vw); display: flex; flex-direction: column; gap: 12px; margin-top: clamp(12px,3vmin,20px); }
.res-btn {
  background: transparent; border: 1px solid rgba(255,255,255,.22);
  color: rgba(255,255,255,.72);
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(14px, 3.5vw, 18px); letter-spacing: .32em;
  padding: clamp(13px,3.2vmin,17px); cursor: pointer; transition: all .3s;
  text-align: center; text-decoration: none; display: block;
  -webkit-tap-highlight-color: transparent;
}
.res-btn:hover, .res-btn:active { color: rgba(255,255,255,.95); border-color: rgba(255,255,255,.5); }

/* granted badge */
.granted-badge {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: clamp(14px, 3.5vw, 18px); letter-spacing: .38em;
  color: rgba(255,160,160,.95);
  padding: 8px 20px; border: 1px solid rgba(255,60,60,.35);
}
.granted-star {
  width: 6px; height: 6px; border-radius: 50%; background: rgba(255,100,100,1);
  animation: gstar 2s ease-in-out infinite;
}
@keyframes gstar { 0%,100%{opacity:.25;transform:scale(.6)} 50%{opacity:1;transform:scale(1.4)} }

/* ══════════════════════════════════════════
   WAITING / ORACLE PAGE (replaces cooldown)
   Shows ONLY after submission, before grant
══════════════════════════════════════════ */
#p-oracle {
  gap: clamp(10px,2.5vmin,18px);
  z-index: 3;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: clamp(32px,10vmin,60px) var(--pad);
}

/* oracle symbol ring — decorative, not a countdown */
.oracle-ring-wrap {
  position: relative;
  width: min(72vw, 68dvh, 360px);
  height: min(72vw, 68dvh, 360px);
  flex-shrink: 0;
}

.oracle-ring-bg {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(255,40,40,.12);
}

/* rotating rune ring */
.oracle-spin-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px dashed rgba(255,40,40,.20);
  animation: oracle-orbit 18s linear infinite;
}
.oracle-spin-ring-2 {
  position: absolute; inset: 8%; border-radius: 50%;
  border: 1px dashed rgba(255,40,40,.10);
  animation: oracle-orbit 32s linear infinite reverse;
}
@keyframes oracle-orbit { to { transform: rotate(360deg); } }

/* rune dots on the outer ring */
.oracle-rune-dot {
  position: absolute; top: clamp(4px,1.2vmin,7px); left: 50%;
  transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(255,80,80,.7);
  box-shadow: 0 0 8px rgba(255,40,40,.8);
}

/* inner glow fill */
.oracle-ring-wrap::before {
  content: "";
  position: absolute; inset: 6%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,40,40,.12) 0%, rgba(255,40,40,.04) 54%, rgba(0,0,0,.2) 70%);
  box-shadow: inset 0 0 34px rgba(255,40,40,.1), 0 0 34px rgba(255,40,40,.06);
}

/* hole in center */
.oracle-ring-wrap::after {
  content: "";
  position: absolute; inset: 22%; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,.85) 0%, rgba(0,0,0,.5) 62%, transparent 100%);
  pointer-events: none;
}

.oracle-center {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
}

.oracle-symbol-display {
  font-size: clamp(32px, calc(min(72vw,68dvh,360px) * .18), 72px);
  color: rgb(255, 60, 60);
  text-shadow: 0 0 28px rgba(255,40,40,.65);
  animation: symbol-pulse 3s ease-in-out infinite;
  letter-spacing: .06em;
}
@keyframes symbol-pulse {
  0%,100% { opacity: .7; transform: scale(.96); }
  50%      { opacity: 1;  transform: scale(1.04); }
}

.oracle-phase-label {
  font-size: clamp(10px, 2.4vw, 14px);
  letter-spacing: .46em;
  color: rgba(255,180,180,.65);
  text-align: center;
}

/* oracle text below ring */
.oracle-msg {
  font-size: clamp(12px, 3vw, 16px); letter-spacing: .26em;
  color: rgba(255,200,200,.68); text-align: center;
  max-width: min(280px,84vw); line-height: 2.3;
  min-height: 2em;
}

/* check-in button */
.oracle-check-btn {
  background: transparent; border: 1px solid rgba(255,60,60,.35);
  color: rgba(255,180,180,.8);
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(14px, 3.4vw, 18px); letter-spacing: .32em;
  padding: clamp(12px,3vmin,16px) clamp(20px,5.5vw,32px);
  cursor: pointer; transition: all .3s;
  -webkit-tap-highlight-color: transparent;
  margin-top: 4px;
}
.oracle-check-btn:hover, .oracle-check-btn:active {
  color: rgba(255,220,220,1);
  border-color: rgba(255,80,80,.7);
  text-shadow: 0 0 20px rgba(255,40,40,.5);
}

/* grant revealed state */
.oracle-granted-msg {
  display: none;
  font-size: clamp(14px, 3.5vw, 18px); letter-spacing: .38em;
  color: rgba(255,160,160,.9); text-align: center;
  animation: pulse-txt 3s ease-in-out infinite;
  cursor: pointer;
  text-shadow: 0 0 20px rgba(255,40,40,.6);
}
.oracle-granted-msg.show { display: block; }

/* ══════════════════════════════════════════
   GRANTED PAGE — shown after wish granted
   Red veil + countdown until "manifestation"
══════════════════════════════════════════ */
#p-granted { gap: clamp(12px,3vmin,20px); z-index: 3; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: clamp(32px,10vmin,56px) var(--pad);
}

.grt-title {
  font-size: clamp(13px, 3.4vw, 18px);
  letter-spacing: .42em;
  color: rgba(255,200,200,.9);
  text-align: center;
  text-shadow: 0 0 30px rgba(255,40,40,.5);
}

/* countdown ring — 7-day manifestation timer */
@property --grt-progress {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}

.grt-ring-wrap {
  position: relative;
  width: min(72vw, 68dvh, 360px);
  height: min(72vw, 68dvh, 360px);
  --grt-progress: 0;
  transition: --grt-progress .8s ease;
  flex-shrink: 0;
}

.grt-ring-wrap::before {
  content: "";
  position: absolute; inset: 6%; border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255,40,40,.25) 0%, rgba(255,40,40,.10) 54%, rgba(0,0,0,.2) 70%),
    conic-gradient(from -90deg,
      rgba(255,40,40,.62) calc(var(--grt-progress) * 1turn),
      rgba(255,40,40,.06) 0);
  box-shadow:
    inset 0 0 40px rgba(255,40,40,.25),
    0 0 40px rgba(255,40,40,.18);
}
.grt-ring-wrap::after {
  content: "";
  position: absolute; inset: 22%; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,.85) 0%, rgba(0,0,0,.5) 62%, transparent 100%);
  pointer-events: none;
}

.grt-ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.grt-ring-bg { fill: none; stroke: rgba(180,30,30,.22); }
.grt-ring-fill {
  fill: none;
  stroke: rgba(255,80,80,.75);
  stroke-linecap: round;
  stroke-width: 1.5;
  transition: stroke-dashoffset .8s ease;
  filter: drop-shadow(0 0 10px rgba(255, 40, 40, .5));
}

.grt-spin-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(255,40,40,.20);
  animation: cd-orbit 8s linear infinite;
}
.grt-spin-dot {
  position: absolute; top: clamp(4px,1.2vmin,7px); left: 50%;
  transform: translateX(-50%);

<script>
/* ══════════════════════════════════════════════════════
  PIXEL HAND MASK — 32×32 grid
══════════════════════════════════════════════════════ */
function buildMask() {
  const m = new Uint8Array(32 * 32);
  const L = [
    [1,12,13],[1,14,16],
    [2,11,16],[3,10,16],[4,10,16],
    [5,9,16],[6,9,16],[7,9,16],[8,9,16],
    [9,8,16],[10,8,16],[11,8,16],[12,8,16],
    [13,7,16],[14,7,16],[15,7,16],[16,7,16],[17,7,16],[18,7,16],
    [19,8,16],[20,8,16],[21,8,16],[22,8,16],[23,8,16],
    [24,9,16],[25,9,16],[26,9,16],[27,9,16],[28,9,16],[29,9,16],[30,9,16],[31,9,16]
  ];
  const SEAM_SHIFT = 1;
  function fillSeg(row,cs,ce){for(let c=cs;c<ce;c++)m[row*32+c]=1;}
  function mirrorSeg(cs,ce){return[(32-ce)+SEAM_SHIFT,(32-cs)+SEAM_SHIFT];}
  function mirrorCol(col){return(31-col)+SEAM_SHIFT;}
  function carve(row,col){if(row<0||row>=32||col<0||col>=32)return;m[row*32+col]=0;}
  L.forEach(([row,cs,ce])=>{
    fillSeg(row,cs,ce);
    const[mcs,mce]=mirrorSeg(cs,ce);
    fillSeg(row,mcs,mce);
  });
  for(let row=2;row<=9;row++){
    [11,13].forEach(col=>{carve(row,col);carve(row,mirrorCol(col));});
  }
  for(let i=0;i<5;i++){const row=13+i,col=14-i;carve(row,col);carve(row,mirrorCol(col));}
  return m;
}
const MASK=buildMask();

/* ══════════════════════════════════════════════════════
   OPTIONAL IMAGE ASSET
══════════════════════════════════════════════════════ */
const HAND_ASSET_CANDIDATES=['./hands.png','./hand.png'];
const FLASH_ASSET_CANDIDATES=['./flash.png','./hands.png'];
let HAND_IMG=null,HAND_PREPARED=null,HAND_READY=false;
let STARTUP_FLASH_DONE=false,STARTUP_FLASH_LAST_AT=0;

function triggerStartupFlash(){
  const now=Date.now();
  if(now-STARTUP_FLASH_LAST_AT<900)return;
  STARTUP_FLASH_LAST_AT=now;STARTUP_FLASH_DONE=false;runStartupFlashOnce();
}

function prepareHandAsset(img){
  const work=document.createElement('canvas');work.width=256;work.height=256;
  const wctx=work.getContext('2d',{willReadFrequently:true});
  wctx.clearRect(0,0,256,256);wctx.imageSmoothingEnabled=false;
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(iw>0&&ih>0){
    const sc=Math.min(256/iw,256/ih);
    const dw=Math.round(iw*sc),dh=Math.round(ih*sc);
    const dx=Math.round((256-dw)/2),dy=Math.round((256-dh)/2);
    wctx.drawImage(img,dx,dy,dw,dh);
  }else{wctx.drawImage(img,0,0,256,256);}
  try{
    const im=wctx.getImageData(0,0,256,256);const d=im.data;const KEEP_T=190;
    let minX=255,minY=255,maxX=0,maxY=0,found=false;
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
      if(a===0)continue;const mx=Math.max(r,g,b);
      if(mx<KEEP_T){d[i+3]=0;continue;}
      d[i]=255;d[i+1]=255;d[i+2]=255;d[i+3]=255;
      const px=((i/4)%256)|0,py=(((i/4)/256)|0);found=true;
      if(px<minX)minX=px;if(py<minY)minY=py;if(px>maxX)maxX=px;if(py>maxY)maxY=py;
    }
    wctx.putImageData(im,0,0);
    if(!found)return work;
    const bw=Math.max(1,maxX-minX+1),bh=Math.max(1,maxY-minY+1);
    const out=document.createElement('canvas');out.width=256;out.height=256;
    const octx=out.getContext('2d',{willReadFrequently:true});
    octx.clearRect(0,0,256,256);octx.imageSmoothingEnabled=false;
    const PAD=10,sc2=Math.min((256-PAD*2)/bw,(256-PAD*2)/bh);
    const dw2=Math.round(bw*sc2),dh2=Math.round(bh*sc2);
    const dx2=Math.round((256-dw2)/2),dy2=Math.round((256-dh2)/2);
    octx.drawImage(work,minX,minY,bw,bh,dx2,dy2,dw2,dh2);
    return out;
  }catch{}return work;
}

function loadHandAsset(){
  return new Promise(resolve=>{
    const img=new Image();img.decoding='async';
    img.onload=()=>{HAND_IMG=img;HAND_PREPARED=prepareHandAsset(img);HAND_READY=true;resolve(true);};
    let idx=0;
    img.onerror=()=>{idx++;if(idx>=HAND_ASSET_CANDIDATES.length)return resolve(false);img.src=HAND_ASSET_CANDIDATES[idx];};
    img.src=HAND_ASSET_CANDIDATES[idx];
  });
}

function renderRecLogo(){
  const c=document.getElementById('rec-logo');if(!c)return;renderStatic(c,c.width||128);
}

function setFaviconFromCanvas(canvas){
  try{
    const url=canvas.toDataURL('image/png');
    let link=document.querySelector('link[rel="icon"]');
    if(!link){link=document.createElement('link');link.rel='icon';document.head.appendChild(link);}
    link.type='image/png';link.href=url;
  }catch{}
}

function buildAppIconFromHand(){
  if(!HAND_READY||!HAND_PREPARED)return;
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,128,128);
  ctx.fillStyle='#000';ctx.fillRect(0,0,128,128);
  ctx.strokeStyle='rgba(255,40,40,.85)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(64,64,54,0,Math.PI*2);ctx.stroke();
  ctx.drawImage(HAND_PREPARED,0,0,256,256,20,20,88,88);
  setFaviconFromCanvas(c);
}

function runStartupFlashOnce(){
  const fl=document.getElementById('flash');if(!fl||STARTUP_FLASH_DONE)return;
  STARTUP_FLASH_DONE=true;
  const img=new Image();let idx=0;
  img.onload=()=>{
    fl.style.backgroundImage=`url('${FLASH_ASSET_CANDIDATES[idx]}')`;
    requestAnimationFrame(()=>{
      fl.classList.add('in');
      setTimeout(()=>{fl.classList.remove('in');setTimeout(()=>{fl.style.backgroundImage='';},160);},500);
    });
  };
  img.onerror=()=>{idx++;if(idx>=FLASH_ASSET_CANDIDATES.length)return;img.src=FLASH_ASSET_CANDIDATES[idx];};
  img.src=FLASH_ASSET_CANDIDATES[idx];
}

/* ══════════════════════════════════════════════════════
   CANVAS RENDERER
══════════════════════════════════════════════════════ */
function renderHands(ctx,size,splitPx,alpha){
  ctx.clearRect(0,0,size,size);if(alpha<0.01)return;
  if(HAND_READY&&HAND_PREPARED){
    ctx.save();ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;
    const halfW=HAND_PREPARED.width/2,h=HAND_PREPARED.height;
    ctx.drawImage(HAND_PREPARED,0,0,halfW,h,-splitPx,0,size/2,size);
    ctx.drawImage(HAND_PREPARED,halfW,0,halfW,h,size/2+splitPx,0,size/2,size);
    ctx.restore();return;
  }
  const sc=size/32;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#fff';
  for(let row=0;row<32;row++)for(let col=0;col<32;col++){
    if(!MASK[row*32+col])continue;
    const isLeft=col<16,ox=isLeft?-splitPx:splitPx;
    ctx.fillRect(col*sc+ox,row*sc,sc,sc);
  }
  ctx.restore();
}

const PERSP=600;
function flipTransform(a){const c=Math.cos(a);return{scaleX:c,shade:Math.abs(c)};}

/* ══════════════════════════════════════════════════════
   ANIMATION ENGINE
══════════════════════════════════════════════════════ */
let RAF=null,phase='idle',phaseT=0;
const SPLIT_START=64,SPLIT_DUR=120;
let splitAmt=SPLIT_START,flipAngle=0,activeCanvases=[];

function stopAnim(){
  if(RAF){cancelAnimationFrame(RAF);RAF=null;}
  activeCanvases.forEach(({el})=>{el.style.transform='';el.style.opacity='';});
  activeCanvases=[];
}

function startAnim(canvasList,loop){
  stopAnim();activeCanvases=canvasList;phase='split-join';phaseT=0;splitAmt=SPLIT_START;flipAngle=0;
  function frame(){
    phaseT++;
    activeCanvases.forEach(({el,size})=>{
      const ctx=el.getContext('2d');
      if(phase==='split-join'){
        const prog=Math.min(phaseT/SPLIT_DUR,1),ease=1-Math.pow(1-prog,3),sp=SPLIT_START*(1-ease);
        renderHands(ctx,size,sp,1);el.style.transform='';
        if(prog>=1){phase='flip-spin';phaseT=0;flipAngle=0;}
      }else if(phase==='flip-spin'){
        flipAngle+=0.065;
        const{shade}=flipTransform(flipAngle);
        el.style.transform=`perspective(${PERSP}px) rotateY(${flipAngle}rad)`;
        el.style.opacity=Math.max(0.18,Math.abs(shade)).toString();
        renderHands(ctx,size,0,1);
        if(flipAngle>=Math.PI*2){
          flipAngle=0;el.style.transform='';el.style.opacity='1';
          if(loop){phase='split-join';phaseT=0;splitAmt=SPLIT_START;}
          else{phase='idle';phaseT=0;}
        }
      }
    });
    RAF=requestAnimationFrame(frame);
  }
  RAF=requestAnimationFrame(frame);
}

function startFlipLoop(canvasList){
  stopAnim();activeCanvases=canvasList;phase='flip-spin';phaseT=0;flipAngle=0;
  function frame(){
    flipAngle+=0.055;
    activeCanvases.forEach(({el,size})=>{
      const ctx=el.getContext('2d');renderHands(ctx,size,0,1);
      el.style.transform=`perspective(${PERSP}px) rotateY(${flipAngle}rad)`;
      el.style.opacity=Math.max(0.18,Math.abs(Math.cos(flipAngle))).toString();
    });
    if(flipAngle>=Math.PI*2)flipAngle=0;
    RAF=requestAnimationFrame(frame);
  }
  RAF=requestAnimationFrame(frame);
}

function renderStatic(canvas,size){
  const ctx=canvas.getContext('2d');renderHands(ctx,size,0,1);
  canvas.style.transform='';canvas.style.opacity='1';
}

/* ══════════════════════════════════════════════════════
   PAGE SYSTEM
══════════════════════════════════════════════════════ */
const ALL_PAGES=['p-splash','p-cam','p-review','p-transmit','p-result','p-oracle','p-granted'];
let ACTIVE_PAGE='p-splash';

/* ══════════════════════════════════════════════════════
   RED VEIL — only for GRANTED state
══════════════════════════════════════════════════════ */
function setRedVeil(on){
  const veil=document.getElementById('red-veil');
  veil.classList.toggle('on',on);
  if(!on) veil.style.opacity=0;
  else veil.style.opacity='';
}

function updateRedVeil(pageId){
  // Red veil ONLY if wish has been granted
  const granted=localStorage.getItem('girigo_granted')==='1';
  setRedVeil(granted && (pageId==='p-granted' || pageId==='p-splash'));
}

function pauseReviewVideo(){
  const prevVid=document.getElementById('prev-vid');
  if(!prevVid)return;
  try{prevVid.pause();prevVid.currentTime=0;}catch{}
}

/* ══════════════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════════════ */
const MAIN_BGM_SRC='./girigo.mp3';
const GHOST_SOUND_SRC='https://www.myinstants.com/media/sounds/04-sound-effects_-eerie-ghost-voice.mp3';
const TRANSMIT_SOUND_SRC='https://www.myinstants.com/media/sounds/suspense-build-up.mp3';
let MAIN_BGM=null,MAIN_BGM_DISABLED=false,AUDIO_CTX=null,AUDIO_UNLOCKED=false;
let GHOST_AUDIO=null,GHOST_DISABLED=false,TRANSMIT_AUDIO=null,TRANSMIT_DISABLED=false;

function isRecordingActive(){return!!(recorder&&recorder.state==='recording');}
function isRecordingTimerVisible(){const t=document.getElementById('cam-timer');return!!(t&&t.classList.contains('show'));}
function mainBgmAllowed(){
  if(ACTIVE_PAGE!=='p-splash')return false;
  if(isRecordingActive())return false;
  return true;
}

function ensureAudioCtx(){
  if(AUDIO_CTX)return;
  try{AUDIO_CTX=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function ensureMainBgm(){
  if(MAIN_BGM||MAIN_BGM_DISABLED)return;
  try{
    MAIN_BGM=new Audio(MAIN_BGM_SRC);
    MAIN_BGM.loop=true;MAIN_BGM.preload='auto';MAIN_BGM.volume=0.8;
    MAIN_BGM.addEventListener('error',()=>{MAIN_BGM_DISABLED=true;MAIN_BGM=null;},{once:true});
  }catch{MAIN_BGM_DISABLED=true;}
}
function pauseMainBgm(){if(!MAIN_BGM)return;try{MAIN_BGM.pause();}catch{}}
function playMainBgm(){
  if(MAIN_BGM_DISABLED||!MAIN_BGM)return;
  if(!mainBgmAllowed())return;if(!MAIN_BGM.paused)return;
  MAIN_BGM.muted=false;
  const p=MAIN_BGM.play();
  if(p&&typeof p.catch==='function'){
    p.catch(()=>{
      if(!mainBgmAllowed())return;
      MAIN_BGM.muted=true;
      const p2=MAIN_BGM.play();
      if(p2&&typeof p2.then==='function'){
        p2.then(()=>{setTimeout(()=>{if(MAIN_BGM&&mainBgmAllowed())MAIN_BGM.muted=false;},50);}).catch(()=>{});
      }
    });
  }
}
function updateMainBgmForPage(){
  if(MAIN_BGM_DISABLED)return;ensureMainBgm();if(!MAIN_BGM)return;
  if(mainBgmAllowed())playMainBgm();else pauseMainBgm();
}
function ensureGhostAudio(){
  if(GHOST_AUDIO||GHOST_DISABLED)return;
  try{
    GHOST_AUDIO=new Audio(GHOST_SOUND_SRC);
    GHOST_AUDIO.preload='auto';GHOST_AUDIO.volume=1;
    GHOST_AUDIO.addEventListener('error',()=>{GHOST_DISABLED=true;GHOST_AUDIO=null;},{once:true});
  }catch{GHOST_DISABLED=true;}
}
function playGhostSound(){
  if(GHOST_DISABLED)return;ensureGhostAudio();if(!GHOST_AUDIO)return;
  try{GHOST_AUDIO.pause();GHOST_AUDIO.currentTime=0;}catch{}
  const p=GHOST_AUDIO.play();
  if(p&&typeof p.catch==='function')p.catch(()=>{});
}
function stopGhostSound(){
  if(!GHOST_AUDIO)return;
  try{GHOST_AUDIO.pause();GHOST_AUDIO.currentTime=0;}catch{}
}
function ensureTransmitAudio(){
  if(TRANSMIT_AUDIO||TRANSMIT_DISABLED)return;
  try{
    TRANSMIT_AUDIO=new Audio(TRANSMIT_SOUND_SRC);
    TRANSMIT_AUDIO.preload='auto';TRANSMIT_AUDIO.volume=1;
    TRANSMIT_AUDIO.addEventListener('error',()=>{TRANSMIT_DISABLED=true;TRANSMIT_AUDIO=null;},{once:true});
  }catch{TRANSMIT_DISABLED=true;}
}
function playTransmitSound(){
  if(TRANSMIT_DISABLED)return;ensureTransmitAudio();if(!TRANSMIT_AUDIO)return;
  try{TRANSMIT_AUDIO.pause();TRANSMIT_AUDIO.currentTime=0;}catch{}
  const p=TRANSMIT_AUDIO.play();
  if(p&&typeof p.catch==='function')p.catch(()=>{});
}
function unlockAudio(){
  if(AUDIO_UNLOCKED)return;AUDIO_UNLOCKED=true;ensureAudioCtx();
  ensureGhostAudio();ensureTransmitAudio();
  if(AUDIO_CTX&&AUDIO_CTX.state==='suspended'){
    AUDIO_CTX.resume().then(()=>updateMainBgmForPage()).catch(()=>updateMainBgmForPage());
  }else{updateMainBgmForPage();}
}
window.addEventListener('pointerdown',unlockAudio,{passive:true,capture:true});
window.addEventListener('touchstart',unlockAudio,{passive:true,capture:true});
window.addEventListener('click',unlockAudio,{passive:true,capture:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateMainBgmForPage();});

/* ══════════════════════════════════════════════════════
   BACKEND INTEGRATION
══════════════════════════════════════════════════════ */
const API_BASE = window.location.origin;
let WISH_ID = localStorage.getItem('girigo_wish_id') || null;

function persistWishSubmission(data){
  WISH_ID = data.wishId;
  localStorage.setItem('girigo_wish_id', WISH_ID);
  localStorage.setItem('girigo_submitted_at', Date.now().toString());
  localStorage.removeItem('girigo_granted');
}

function loadSupabaseClient(){
  if(window.supabase&&window.supabase.createClient)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-supabase-js]');
    if(existing){
      existing.addEventListener('load',()=>resolve(),{once:true});
      existing.addEventListener('error',()=>reject(new Error('supabase client failed')),{once:true});
      return;
    }
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.async=true;s.dataset.supabaseJs='1';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('supabase client failed'));
    document.head.appendChild(s);
  });
}

async function submitWishViaSupabase(videoBlob,durationSec){
  const initRes=await fetch(`${API_BASE}/api/wish/upload-url`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contentType:videoBlob.type||'video/webm',size:videoBlob.size||0})
  });
  if(!initRes.ok)throw new Error('supabase upload unavailable');
  const upload=await initRes.json();
  await loadSupabaseClient();
  const client=window.supabase.createClient(upload.supabaseUrl,upload.anonKey);
  const {error:uploadError}=await client.storage
    .from(upload.bucket)
    .uploadToSignedUrl(upload.path,upload.token,videoBlob,{contentType:videoBlob.type||'video/webm'});
  if(uploadError)throw uploadError;

  const completeRes=await fetch(`${API_BASE}/api/wish/complete`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      wishId:upload.wishId,
      path:upload.path,
      fileName:upload.fileName,
      durationSec,
      size:videoBlob.size||0
    })
  });
  if(!completeRes.ok)throw new Error('oracle save failed');
  return completeRes.json();
}

async function submitWishViaServer(videoBlob,durationSec){
  const fd = new FormData();
  fd.append('video', videoBlob, 'wish.webm');
  fd.append('durationSec', durationSec.toString());
  const res = await fetch(`${API_BASE}/api/wish`, { method: 'POST', body: fd });
  if(!res.ok) throw new Error('oracle offline');
  return res.json();
}

async function submitWishToOracle(videoBlob, durationSec){
  try {
    let data;
    try{data=await submitWishViaSupabase(videoBlob,durationSec);}
    catch{data=await submitWishViaServer(videoBlob,durationSec);}
    persistWishSubmission(data);
    return data;
  } catch(e) {
    // Fallback: store locally if server unreachable
    console.warn('Oracle server offline — local fallback');
    WISH_ID = 'local_' + Date.now();
    localStorage.setItem('girigo_wish_id', WISH_ID);
    localStorage.setItem('girigo_submitted_at', Date.now().toString());
    localStorage.removeItem('girigo_granted');
    return {
      wishId: WISH_ID, phase: 'submission',
      phaseLabel: '봉헌 수신됨', symbol: '⊙',
      message: '봉헌이 신탁에 전달되었습니다.'
    };
  }
}

async function fetchOracleStatus(){
  if(!WISH_ID) return null;
  if(WISH_ID.startsWith('local_')){
    // Local fallback evaluation after ~10s for demo purposes
    const submittedAt = parseInt(localStorage.getItem('girigo_submitted_at')||'0');
    const elapsed = Date.now() - submittedAt;
    const DEMO_GRANT_MS = 10000; // 10s demo
    if(elapsed >= DEMO_GRANT_MS){
      const score = (submittedAt % 7);
      const granted = score >= 3;
      return {
        wishId: WISH_ID, phase: granted ? 'granted' : 'contemplation',
        phaseLabel: granted ? '현현 허락됨' : '침묵 속 숙고',
        symbol: granted ? '✦' : '◌',
        granted: granted ? true : null,
        remainingMs: Math.max(0, DEMO_GRANT_MS - elapsed),
        oracleText: granted
          ? '신탁이 허락하였습니다. 소원이 이루어집니다.'
          : '신탁이 봉헌을 살피고 있습니다. 기다리십시오.',
        submittedAt,
      };
    }
    return {
      wishId: WISH_ID, phase: 'submission',
      phaseLabel: '봉헌 수신됨', symbol: '⊙',
      granted: null, remainingMs: DEMO_GRANT_MS - elapsed,
      oracleText: '봉헌이 신탁에 전달되었습니다.',
      submittedAt,
    };
  }
  try {
    const res = await fetch(`${API_BASE}/api/wish/${WISH_ID}`);
    if(!res.ok) throw new Error('not found');
    return await res.json();
  } catch {
    return null;
  }
}

function tryGoCamera(){
  const submittedAt = parseInt(localStorage.getItem('girigo_submitted_at')||'0');

  const granted = localStorage.getItem('girigo_granted')==='1';

/* ══════════════════════════════════════════════════════
   ORACLE WAITING PAGE
══════════════════════════════════════════════════════ */
async function updateOracleUI(){
  const data = await fetchOracleStatus();
  if(!data) return;

  document.getElementById('oracle-symbol-display').textContent = data.symbol || '⊙';
  document.getElementById('oracle-phase-label').textContent = data.phaseLabel || '';
  document.getElementById('oracle-msg').textContent = data.oracleText || '';

  if(data.granted === true){
    localStorage.setItem('girigo_granted','1');
    localStorage.setItem('girigo_granted_at', Date.now().toString());
    document.getElementById('oracle-granted-msg').classList.add('show');
    setRedVeil(false); // not yet — show veil only on granted page
  }
}

async function checkOracleStatus(){
  const btn = document.querySelector('.oracle-check-btn');
  if(btn){ btn.textContent='신탁을 읽는 중…'; btn.disabled=true; }
  await updateOracleUI();
  setTimeout(()=>{
    if(btn){ btn.textContent='신탁 확인하기'; btn.disabled=false; }
  },1800);

  // If granted, auto navigate after brief pause
  if(localStorage.getItem('girigo_granted')==='1'){
    setTimeout(goGrantedPage, 2200);
  }
}

/* ══════════════════════════════════════════════════════
   GRANTED TIMER — 7-day manifestation countdown
   Starts from when the wish was granted
══════════════════════════════════════════════════════ */
const MANIFEST_MS = 7 * 24 * 60 * 60 * 1000; // 7 days
let grtTicker = null;

function startGrantedTimer(){
  setRedVeil(true); // NOW we show the veil
  if(grtTicker) clearInterval(grtTicker);
  updateGrantedUI();
  grtTicker = setInterval(updateGrantedUI, 1000);
}

function updateGrantedUI(){
  const grantedAt = parseInt(localStorage.getItem('girigo_granted_at')||'0');
  if(!grantedAt){ clearInterval(grtTicker); return; }

  const elapsed = Date.now() - grantedAt;
  const remaining = Math.max(0, MANIFEST_MS - elapsed);
  const pct = Math.min(1, elapsed / MANIFEST_MS);

  const timeEl = document.getElementById('grt-time');
  const arcEl  = document.getElementById('grt-arc');
  const wrap   = document.getElementById('grt-ring-wrap');
  const manifestEl = document.getElementById('grt-manifest-msg');

  if(remaining <= 0){
    clearInterval(grtTicker);
    timeEl.textContent = '현현';
    arcEl.style.strokeDashoffset = '0';
    wrap.style.setProperty('--grt-progress','1');
    manifestEl.classList.add('show');
    document.getElementById('grt-msg').style.opacity = '0';
    return;
  }

  const totalSec = Math.floor(remaining / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;

  if(d > 0){
    timeEl.textContent = `${d}일 ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
  } else {
    timeEl.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }

  wrap.style.setProperty('--grt-progress', pct.toString());
  arcEl.style.strokeDashoffset = (553 * (1 - pct)).toString();
}

/* ══════════════════════════════════════════════════════
   RECORDING
══════════════════════════════════════════════════════ */
let stream=null,recorder=null,chunks=[],blob=null,blobURL=null;
let recSec=0,recTick=null;

function killStream(){stopGhostSound();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}

function startRec(){
  if(!stream)return;chunks=[];
  const mime=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  recorder.ondataavailable=ev=>{if(ev.data&&ev.data.size>0)chunks.push(ev.data);};
  recorder.start(100);
  playGhostSound();
  document.getElementById('rec-btn').classList.add('recording');
  document.getElementById('cam-rec').classList.add('on');
  document.getElementById('cam-hint').textContent='소원을 말하세요…';
  recSec=0;showTimer();
  recTick=setInterval(()=>{recSec++;showTimer();if(recSec>=30)stopRec();},1000);
  updateMainBgmForPage();
}

function stopRec(){
  if(!recorder||recorder.state==='inactive')return;
  stopGhostSound();
  recorder.stop();clearInterval(recTick);
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('cam-rec').classList.remove('on');
  document.getElementById('cam-timer').classList.remove('show');
  document.getElementById('cam-hint').textContent='탭해서 시작 / 탭해서 종료';
  recorder.onstop=()=>{
    const type=chunks[0]?.type||'video/webm';
    blob=new Blob(chunks,{type});
    if(blobURL)URL.revokeObjectURL(blobURL);
    blobURL=URL.createObjectURL(blob);
    // Load video and show review maximized
    const prevVid = document.getElementById('prev-vid');
    prevVid.src = blobURL;
    prevVid.load();
    show('p-review');
  };
}

function toggleRec(e){
  if(e)e.preventDefault();if(!stream)return;
  if(!recorder||recorder.state==='inactive')startRec();else stopRec();
}

function showTimer(){
  const el=document.getElementById('cam-timer');el.classList.add('show');
  const m=Math.floor(recSec/60),s=recSec%60;
  el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  updateMainBgmForPage();
}

function retake(){
  show('p-cam');
  // Restart camera if needed
  if(!stream){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:true})
      .then(s=>{stream=s;document.getElementById('vid').srcObject=s;})
      .catch(()=>document.getElementById('cam-err').classList.add('show'));
  }
}

/* ══════════════════════════════════════════════════════
   TRANSMIT → RESULT (with backend upload)
══════════════════════════════════════════════════════ */
async function transmit(){
  if(!blob) return;
  pauseReviewVideo();
  killStream();

  // Disable button to prevent double-tap
  const btn = document.getElementById('transmit-btn');
  if(btn){ btn.disabled=true; }
  document.getElementById('rev-uploading').classList.add('show');
  document.querySelector('.rev-actions').style.opacity='0.4';

  playTransmitSound();

  show('p-transmit',()=>{
    const tc=document.getElementById('tx-canvas');tc.width=256;tc.height=256;
    startFlipLoop([{el:tc,size:256}]);
  });

  // Upload to oracle server
  const oracleData = await submitWishToOracle(blob, recSec || 5);

  setTimeout(()=>{
    document.getElementById('dl-link').href=blobURL||'#';
    showResult(oracleData);
  }, 3200);
}

function showResult(oracleData){
  show('p-result',()=>{
    stopAnim();
    const rc=document.getElementById('res-canvas');rc.width=256;rc.height=256;renderStatic(rc,256);
    document.getElementById('res-status-text').textContent='소원이 전달되었습니다';

    // Oracle badge
    if(oracleData){
      document.getElementById('ob-symbol').textContent  = oracleData.symbol || '⊙';
      document.getElementById('ob-phase').textContent   = oracleData.phaseLabel || '';
      document.getElementById('ob-text').textContent    = oracleData.message || '';
    }

    document.getElementById('granted-badge-wrap').innerHTML =
      `<div style="font-size:clamp(12px,3vw,15px);letter-spacing:.35em;color:rgba(255,200,200,.65);">신탁이 침묵 속에 봉헌을 살핍니다</div>`;
  });
}

function installAdminUnlock(){
  const MAX_BUFFER=96,MIN_PROBE=8;
  let buffer='',pending=false,lastCandidate='';
  async function probeAdminUnlock(){
    if(pending||buffer.length<MIN_PROBE||buffer===lastCandidate)return;
    const candidate=buffer;
    pending=true;lastCandidate=candidate;
    try{
      const res=await fetch('/api/admin/unlock',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({candidate})
      });
      if(res.ok)window.location.href='/admin';
    }catch{}finally{pending=false;}
  }
  window.addEventListener('keydown',async ev=>{
    if(ev.defaultPrevented||ev.metaKey||ev.ctrlKey||ev.altKey)return;
    if(ev.key.length!==1)return;
    buffer=(buffer+ev.key).slice(-MAX_BUFFER);
    probeAdminUnlock();
  });
}
installAdminUnlock();
